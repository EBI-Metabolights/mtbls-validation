[project]
name = "mtbls-validation"
version = "2.0.2"
description = "MetaboLights Validation Framework"
authors = [{ name = "MetaboLights Team", email = "metabolights-help@ebi.ac.uk" }]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
]

[dependency-groups]
dev = [
    "pydantic>=2.12.5",
    "pandas>=3.0.0",
    "openpyxl>=3.1.5",
    "metabolights-utils>=1.4.34,<2",
    "pydantic2-to-typescript>=0.0.1",
    "jsonschema>=4.25.1",
    "pybreaker>=1.4.1",
    "redis>=7.0.1",
    "keyring>=25.7.0",
    "mkdocs-material>=9.7.1",
    "ruff>=0.15.0",
    # security related dependencues
    "cryptography>=46.0.7",
    "commitizen>=4.19.2",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$major.$minor.$patch"
version_files = [
    "pyproject.toml:version",
    "scripts/__init__.py:__version__",
    "validation/metabolights/validation/v2/configuration/version.json:version",
    "validation/metabolights/validation/v2/configuration/rules.json:validation_version"
    
]
bump_message = "bump: version $current_version -> $new_version"
update_changelog_on_bump = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["validation*", "scripts*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"validation" = ["**/*.json", "**/*.rego"]

[tool.setuptools]
include-package-data = true


[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F", "I", "G", "SLF", "Q"]
ignore = [ "ANN401", "BLE001", "SIM102", "RUF012", "TRY201",  "FLY002", "TRY002", "TRY203"]

fixable = ["ALL"]
